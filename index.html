<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LoopOfALifetime</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <main class="game">
        <header class="game-header">
            <h1>Loop Of A Lifetime</h1>
            <p>Status: <span id="status">Paused</span></p>

            <button id="run-button" type="button">Run</button>
            <button id="pause-button" type="button">Pause</button>
        </header>

        <section class="statistics">
            <h2>Statistics</h2>
            <p>Age: <span id="age">18</span></p>
            <p>Cash: $<span id="money">1000</span></p>
            <p>Job: <span id="job">None</span></p>
            <p>Education: <span id="education">High School</span></p>
            <p>Smartness: <span id="smartness">0</span></p>
            <p>Well Being: <span id="well-being">0</span></p>
        </section>

        <section class="activities">
            <h2>Activities</h2>
            <button id="study-button" type="button">Study</button>
            <button id="relax-button" type="button">Relax</button>
        </section>

        <section class="life-log">
            <h2>Life Log</h2>
            <p id="ticker">The game is ready.</p>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
